project_id = "babu-shop-wifi"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[studio]
enabled = true
port = 54323
[auth]
enabled = true
site_url = "http://127.0.0.1:5188"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = false
minimum_password_length = 12
[auth.email]
# Email provider must remain enabled; global auth.enable_signup=false blocks registration.
enable_signup = true
enable_confirmations = true
