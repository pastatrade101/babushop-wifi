# BABU-SHOP WIFI — deployment on the shared Makutano VPS.
#
# Use this file instead of docker-compose.yml on that host. The root compose
# file ships its own Caddy on :80/:443, which would collide with the server's
# existing `makutano-digital-caddy`. Here TLS is terminated by that shared
# Caddy, which reaches these containers by name over `makutano-net`:
#
#   wifi.makutano.co.tz  /api/v1* /health/* /docs*  ->  babu-wifi-api:4000
#   wifi.makutano.co.tz  everything else           ->  babu-wifi-web:3000
#
# No port is published to the host. The server has no firewall, so a published
# port would be world-reachable the moment it opened. Keep it that way.
#
#   docker compose -f docker-compose.makutano.yml up -d --build
#
# Secrets live in .env.api and .env.web beside this file (both gitignored).
# .env.api holds the runtime DATABASE_URL and voucher keys and must never be
# given to web. .env.web holds only publishable values.

services:
  api:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    image: babu-wifi:latest
    container_name: babu-wifi-api
    command: ["pnpm", "--filter", "@babu/api", "start"]
    env_file: .env.api
    environment:
      NODE_ENV: production
      API_HOST: 0.0.0.0
      API_PORT: "4000"
    networks: [makutano-net]
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 8s
      start_period: 20s
      retries: 3

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    image: babu-wifi:latest
    container_name: babu-wifi-worker
    command: ["pnpm", "--filter", "@babu/worker", "start"]
    env_file: .env.api
    environment:
      NODE_ENV: production
    depends_on:
      - api
    networks: [makutano-net]
    restart: unless-stopped
    # The worker finishes its bounded in-flight authorization before exiting.
    stop_grace_period: 40s

  web:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    image: babu-wifi:latest
    container_name: babu-wifi-web
    command: ["node", "apps/web/build"]
    env_file: .env.web
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      # Server-side rendering talks to the API container directly. The browser
      # never uses this: it goes to the same-origin /api/v1 path Caddy routes.
      API_INTERNAL_URL: http://babu-wifi-api:4000
      # adapter-node rejects form POSTs whose Origin does not match ORIGIN
      # (set in .env.web), and needs these to see the real client behind Caddy.
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      ADDRESS_HEADER: X-Forwarded-For
      XFF_DEPTH: "1"
    depends_on:
      - api
    networks: [makutano-net]
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/portal').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

networks:
  makutano-net:
    external: true
    name: makutano-net
